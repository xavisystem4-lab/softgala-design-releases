# Publica un release cuando se sube un instalador a dist/ (SoftGalaDesign-Setup-X.Y.Z.exe).
# Luego quita el .exe del repositorio para no hacerlo pesado: queda solo en el release.
name: Publicar versión

on:
  push:
    branches: [main]
    paths: ['dist/*.exe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for f in dist/SoftGalaDesign-Setup-*.exe; do
            [ -f "$f" ] || continue
            v=$(basename "$f" .exe | sed 's/SoftGalaDesign-Setup-//')
            notes="dist/notas-$v.md"
            [ -f "$notes" ] || echo "Soft-Gala Design $v" > "$notes"
            if gh release view "v$v" >/dev/null 2>&1; then
              gh release upload "v$v" "$f" --clobber
            else
              gh release create "v$v" "$f" --title "Soft-Gala Design v$v" --notes-file "$notes" --latest
            fi
          done
      - name: Quitar instaladores del repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q dist/*.exe
          git commit -m "Instalador publicado en Releases" && git push
